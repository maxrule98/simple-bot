apiVersion: 1

datasources:
  # Prometheus data source for real-time metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "1s"
      queryTimeout: "30s"
      httpMethod: "POST"

  # SQLite data source for historical analysis
  # Note: Requires grafana-sqlite-datasource plugin
  # Install: docker exec grafana grafana-cli plugins install frser-sqlite-datasource
  - name: Trading Database
    type: frser-sqlite-datasource
    access: proxy
    url: file:/app/data/trading.db
    editable: true
    jsonData:
      path: /app/data/trading.db
